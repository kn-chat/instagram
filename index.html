<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KNChat — Private. Secure. Yours.</title>
  
  <!-- App Icons -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1dI55bE4KZBPEvZKj5RdTAwpJh4yne-KO">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1dI55bE4KZBPEvZKj5RdTAwpJh4yne-KO">
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="data:application/json,{%22name%22:%22KNChat%22,%22short_name%22:%22KNChat%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%2307090e%22,%22theme_color%22:%22%2307090e%22}">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07090e">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(15, 18, 28, 0.85);
      --accent-blue: #0088ff;
      --accent-purple: #8b2fc9;
      --gradient-primary: linear-gradient(135deg, #0088ff 0%, #8b2fc9 100%);
      --text-main: #f0f3f9;
      --text-muted: #8a94a6;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: fixed;
    }

    .hidden { display: none !important; }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 481px) {
      .app-card {
        height: 92vh;
        max-height: 780px;
        border-radius: 28px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.5);
      }
    }

    #auth-screen {
      padding: 30px 24px;
      text-align: center;
      justify-content: center;
      overflow-y: auto;
      position: relative;
    }

    .top-bar-home {
      position: absolute;
      top: 18px;
      right: 18px;
    }

    .admin-btn-home {
      background: rgba(139, 47, 201, 0.15);
      color: #c084fc;
      border: 1px solid rgba(139, 47, 201, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .main-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .auth-title { 
      font-size: 30px; 
      font-weight: 800; 
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .title-kn { color: #0088ff; }
    .title-chat { color: #ffffff; opacity: 0.95; }
    
    .auth-subtitle { 
      font-size: 10px; 
      color: var(--text-muted); 
      margin-bottom: 28px; 
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .input-group { position: relative; margin-bottom: 12px; }
    .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    input[type="text"], select {
      width: 100%;
      background: rgba(10, 13, 20, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 14px 14px 14px 46px;
      border-radius: 16px;
      font-size: 14px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
      appearance: none;
    }

    .select-wrapper { position: relative; margin-bottom: 16px; }
    .select-wrapper::after {
      content: '\f0d7';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .btn-primary {
      width: 100%;
      background: var(--gradient-primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0, 136, 255, 0.25);
    }

    /* Chat Header */
    .chat-header {
      padding: 10px 12px;
      background: rgba(10, 13, 20, 0.9);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left { display: flex; align-items: center; gap: 8px; }

    .back-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }

    .room-info { display: flex; flex-direction: column; gap: 2px; }
    .room-name-container { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; background-color: #0088ff; border-radius: 50%; box-shadow: 0 0 8px #0088ff; }
    .room-name { font-weight: 700; font-size: 13px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .online-count { font-size: 10px; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 5px; }

    .icon-action-btn {
      background: rgba(0, 136, 255, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 136, 255, 0.25);
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
    }

    .lock-btn {
      background: rgba(255, 193, 7, 0.12);
      color: #ffc107;
      border: 1px solid rgba(255, 193, 7, 0.25);
    }

    .lock-btn.active {
      background: #ffc107;
      color: #000;
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.6);
    }

    .clear-btn {
      background: rgba(248, 81, 73, 0.12);
      color: #ff7b72;
      border: 1px solid rgba(248, 81, 73, 0.25);
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .alias-badge {
      background: rgba(0, 136, 255, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 136, 255, 0.3);
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .admin-badge {
      background: rgba(139, 47, 201, 0.2) !important;
      color: #c084fc !important;
      border-color: rgba(139, 47, 201, 0.4) !important;
    }

    #messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      position: relative;
    }

    .system-welcome-card {
      background: rgba(139, 47, 201, 0.08);
      border: 1px dashed rgba(139, 47, 201, 0.3);
      padding: 14px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 8px;
    }

    .welcome-title {
      font-size: 13px;
      font-weight: 700;
      color: #c084fc;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .welcome-text { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }

    .message {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
      cursor: pointer;
    }

    .message.outgoing {
      align-self: flex-end;
      background: var(--gradient-primary);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(0, 136, 255, 0.2);
    }

    .message.incoming {
      align-self: flex-start;
      background: rgba(22, 28, 42, 0.9);
      border: 1px solid var(--border-color);
      color: #e6edf3;
      border-bottom-left-radius: 4px;
    }

    .sender-tag { font-size: 10px; font-weight: 700; margin-bottom: 4px; display: block; opacity: 0.9; }

    .replied-context {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid #00f0ff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      margin-bottom: 6px;
      opacity: 0.92;
    }
    .replied-context-user { font-weight: 700; font-size: 10px; color: #00f0ff; }

    .chat-img-msg {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 4px;
      display: block;
      cursor: pointer;
    }

    .audio-player-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.25);
      padding: 8px 12px;
      border-radius: 14px;
      margin-top: 4px;
      min-width: 180px;
    }

    .audio-play-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffffff;
      color: var(--accent-blue);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }

    .audio-wave-visual {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      height: 20px;
    }

    .audio-wave-bar {
      width: 3px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 3px;
      animation: wavePulse 1s infinite ease-in-out alternate;
    }

    .reaction-popup {
      position: absolute;
      top: -44px;
      background: rgba(15, 20, 32, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      z-index: 100;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .message.outgoing .reaction-popup { right: 0; }
    .message.incoming .reaction-popup { left: 0; }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .react-emoji { font-size: 18px; cursor: pointer; transition: transform 0.15s; }
    .react-emoji:hover, .react-emoji:active { transform: scale(1.35); }

    .reactions-display {
      display: flex;
      gap: 4px;
      font-size: 11px;
      margin-top: 4px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 10px;
      width: fit-content;
    }

    .msg-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .read-receipt { font-size: 12px; }
    .read-receipt.seen { color: #00f0ff; }

    .typing-indicator-box {
      font-size: 12px;
      color: #0088ff;
      font-weight: 600;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 13, 20, 0.95);
      border-top: 1px solid var(--border-color);
      width: 100%;
    }

    .typing-dots { display: flex; align-items: center; gap: 3px; }
    .typing-dots span {
      display: inline-block; width: 5px; height: 5px; border-radius: 50%;
      background-color: #0088ff; animation: typingDots 1.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typingDots {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    .recording-popup-bar {
      padding: 10px 16px;
      background: rgba(248, 81, 73, 0.15);
      border-top: 1px solid rgba(248, 81, 73, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .rec-info { display: flex; align-items: center; gap: 10px; color: #ff7b72; font-size: 13px; font-weight: 700; }
    .wave-container { display: flex; align-items: center; gap: 3px; height: 18px; }
    .wave-bar { width: 3px; height: 100%; background-color: #ff7b72; border-radius: 3px; animation: wavePulse 0.8s infinite ease-in-out alternate; }
    .wave-bar:nth-child(1) { animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { animation-delay: 0.3s; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.4s; }
    .wave-bar:nth-child(5) { animation-delay: 0.15s; }

    @keyframes wavePulse { 0% { height: 4px; } 100% { height: 18px; } }

    .rec-actions { display: flex; align-items: center; gap: 10px; }
    .btn-rec-cancel { background: rgba(255, 255, 255, 0.1); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .btn-rec-send { background: #ff7b72; color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }

    .reply-preview-box {
      background: rgba(15, 20, 32, 0.98);
      border-top: 1px solid var(--accent-blue);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .reply-preview-info {
      display: flex; flex-direction: column; border-left: 2px solid var(--accent-blue);
      padding-left: 10px; max-width: 85%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .reply-preview-user { font-weight: 700; font-size: 11px; color: var(--accent-blue); }
    .reply-preview-text { color: var(--text-muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
    .close-reply-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; }

    .chat-input-area {
      padding: 12px 14px;
      background: rgba(10, 13, 20, 0.95);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chat-input-area input { flex: 1; margin-bottom: 0; }

    .action-icon-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .action-icon-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.12); }

    .send-btn {
      width: 44px;
      height: 44px;
      background: var(--gradient-primary);
      border: none;
      color: white;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(139, 47, 201, 0.3);
    }

    /* Modal Styles */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #0f131f;
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .modal-title { font-size: 16px; font-weight: 700; color: #c084fc; }
    .close-modal-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }

    .notify-toggle-box {
      background: rgba(139, 47, 201, 0.1);
      border: 1px solid rgba(139, 47, 201, 0.3);
      padding: 12px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .notify-info { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #e6edf3; }

    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2a3042; transition: .3s; border-radius: 24px;
    }

    .slider:before {
      position: absolute; content: "";
      height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }

    input:checked + .slider { background: var(--gradient-primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .room-list-container {
      overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex: 1;
    }

    .admin-room-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .admin-room-name { font-size: 13px; font-weight: 600; color: #e6edf3; }
    .admin-item-actions { display: flex; gap: 6px; }

    .btn-small-join { background: var(--accent-blue); color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .btn-small-delete { background: rgba(248, 81, 73, 0.2); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.3); padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; }

    /* Video & Audio Call Modal Styles */
    #call-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #07090e;
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 75%;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #remote-video { width: 100%; height: 100%; object-fit: cover; }
    #local-video {
      position: absolute;
      top: 15px; right: 15px;
      width: 100px; height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid var(--accent-blue);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .call-controls { display: flex; gap: 20px; margin-bottom: 30px; }

    .call-btn-circle {
      width: 55px; height: 55px;
      border-radius: 50%;
      border: none;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-end-call { background: #ff7b72; }
    .btn-mute { background: rgba(255,255,255,0.15); }

    .incoming-call-card {
      background: #0f131f;
      border: 1px solid var(--accent-blue);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 136, 255, 0.4);
    }

    .incoming-call-actions { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
    .btn-accept-call { background: #2ea043; color: white; padding: 10px 20px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
    .btn-reject-call { background: #f85149; color: white; padding: 10px 20px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }

    #messages-container::-webkit-scrollbar { width: 3px; }

  <script>
    const SUPABASE_URL = 'https://afxhzppcjehkvalskbtd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Jzc-Od84UuWSEtbldY0LIg_aznQn8uD';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const CLOUDINARY_CLOUD_NAME = 'jf8nxu3z'; 
    const CLOUDINARY_UPLOAD_PRESET = 'knchat_preset';

    const prefixes = ["Ghost", "Cipher", "Phantom", "Shadow", "Vortex", "Agent", "Nexus"];
    let myAlias = `${prefixes[Math.floor(Math.random() * prefixes.length)]}-${Math.floor(1000 + Math.random() * 9000)}`;
    let isAdminUser = false;
    let notificationsEnabled = false;
    let globalAdminChannel = null;

    let currentRoom = '';
    let roomChannel = null;
    let isUserScrolledUp = false;
    let typingTimeout = null;
    let popupTimer = null;
    let activeReplyMsg = null;
    let isRoomLockedForAlert = false;

    // WebRTC & Audio Synthesizer States
    let peerConnection = null;
    let localStream = null;
    let incomingCallData = null;
    let isMuted = false;
    let audioCtx = null;
    let ringtoneInterval = null;

    // Recording variables
    let mediaRecorder = null;
    let audioChunks = [];
    let recTimerInterval = null;
    let secondsRecorded = 0;

    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const adminModal = document.getElementById('admin-modal');
    const roomIdInput = document.getElementById('room-id-input');
    const joinBtn = document.getElementById('join-btn');
    const roomTitle = document.getElementById('room-title');
    const myAliasSpan = document.getElementById('my-alias');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const onlineCountSpan = document.getElementById('online-count');
    const adminRoomList = document.getElementById('admin-room-list');
    const typingIndicator = document.getElementById('typing-indicator');
    const typingUser = document.getElementById('typing-user');
    const recordingPopup = document.getElementById('recording-popup');
    const recTimer = document.getElementById('rec-timer');

    if (myAliasSpan) myAliasSpan.innerText = myAlias;

    function selectUniversalRoom(val) { if (val) roomIdInput.value = val; }

    messagesContainer.addEventListener('scroll', () => {
      const threshold = 80;
      const position = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
      isUserScrolledUp = position > threshold;
    });

    function playRingtoneSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        ringtoneInterval = setInterval(() => {
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }, 1000);
      } catch (e) {}
    }

    function stopRingtoneSound() {
      if (ringtoneInterval) {
        clearInterval(ringtoneInterval);
        ringtoneInterval = null;
      }
    }

    function toggleRoomLock() {
      isRoomLockedForAlert = !isRoomLockedForAlert;
      const lockBtn = document.getElementById('lock-btn');
      if (isRoomLockedForAlert) {
        lockBtn.classList.add('active');
        alert("Room Alert Activated! Messages and calls will trigger ringtone sound notifications.");
      } else {
        lockBtn.classList.remove('active');
        alert("Room Alert Deactivated.");
      }
    }

    function enterRoom() {
      const roomId = roomIdInput.value.trim();
      if (!roomId) return alert("Please enter a Room Key!");

      currentRoom = roomId;
      roomTitle.innerText = roomId;

      authScreen.classList.add('hidden');
      adminModal.classList.add('hidden');
      chatScreen.classList.remove('hidden');

      if (supabaseClient) {
        loadMessages(true);
        subscribeToRoom();
      }
    }

    function goHome() {
      if (roomChannel && supabaseClient) supabaseClient.removeChannel(roomChannel);
      chatScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
      currentRoom = '';
    }

    joinBtn.addEventListener('click', enterRoom);
    roomIdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') enterRoom(); });

    async function openAdminPanel() {
      const pwd = prompt("Enter Admin Password:");
      if (pwd === "ss43") {
        isAdminUser = true;
        myAlias = "Kazim Nahian (Admin)";
        myAliasSpan.innerText = myAlias;
        myAliasSpan.classList.add('admin-badge');

        await fetchAllActiveRooms();
        adminModal.classList.remove('hidden');
      } else if (pwd !== null) {
        alert("Incorrect Password!");
      }
    }

    function closeAdminPanel() { adminModal.classList.add('hidden'); }

    function toggleAdminNotifications(enabled) {
      notificationsEnabled = enabled;
      if (enabled) {
        if ("Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
        }
        startGlobalAdminListener();
        alert("Live Notifications Activated for Admin!");
      } else {
        if (globalAdminChannel && supabaseClient) supabaseClient.removeChannel(globalAdminChannel);
      }
    }

    function startGlobalAdminListener() {
      if (!supabaseClient) return;

      globalAdminChannel = supabaseClient
        .channel('global_admin_notifications')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'room_messages' }, payload => {
          if (!notificationsEnabled) return;
          const msg = payload.new;

          const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
          audio.play().catch(() => {});

          if ("Notification" in window && Notification.permission === "granted") {
            new Notification(`KNChat Alert [${msg.room_id}]`, {
              body: `${msg.sender_alias}: ${msg.message_text}`,
              icon: 'https://lh3.googleusercontent.com/d/1dI55bE4KZBPEvZKj5RdTAwpJh4yne-KO'
            });
          }
        })
        .subscribe();
    }

    async function fetchAllActiveRooms() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('room_messages')
        .select('room_id');

      if (error) return;

      const uniqueRooms = [...new Set(data.map(item => item.room_id))];
      adminRoomList.innerHTML = '';

      if (uniqueRooms.length === 0) {
        adminRoomList.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:20px;">No Active Chat Rooms Found</div>`;
        return;
      }

      uniqueRooms.forEach(room => {
        const item = document.createElement('div');
        item.className = 'admin-room-item';
        item.innerHTML = `
          <span class="admin-room-name"><i class="fa-solid fa-hashtag" style="color:var(--accent-blue);"></i> ${escapeHTML(room)}</span>
          <div class="admin-item-actions">
            <button class="btn-small-join" onclick="adminJoinRoom('${escapeHTML(room)}')">Join</button>
            <button class="btn-small-delete" onclick="adminDeleteRoom('${escapeHTML(room)}')">Delete</button>
          </div>
        `;
        adminRoomList.appendChild(item);
      });
    }

    function adminJoinRoom(roomName) { 
      roomIdInput.value = roomName;
      enterRoom();
    }

    async function adminDeleteRoom(roomName) {
      if (!confirm(`Are you sure you want to delete room '${roomName}'?`)) return;

      const { error } = await supabaseClient.from('room_messages').delete().eq('room_id', roomName);
      if (!error) {
        alert(`Room '${roomName}' deleted successfully.`);
        fetchAllActiveRooms();
      }
    }

    // WebRTC Call Controls
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function startCall(isVideo) {
      document.getElementById('call-screen').classList.remove('hidden');
      document.getElementById('call-status').innerText = isVideo ? "Starting Video Call..." : "Starting Audio Call...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('remote-video').srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate && roomChannel) {
            roomChannel.send({ type: 'broadcast', event: 'ice-candidate', payload: { candidate: event.candidate, sender: myAlias } });
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        roomChannel.send({
          type: 'broadcast',
          event: 'call-offer',
          payload: { offer, caller: myAlias, isVideo }
        });

      } catch (err) {
        alert("Unable to access camera or microphone!");
        endCall();
      }
    }

    async function acceptCall() {
      stopRingtoneSound();
      document.getElementById('incoming-call-modal').classList.add('hidden');
      document.getElementById('call-screen').classList.remove('hidden');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: incomingCallData.isVideo, audio: true });
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          document.getElementById('remote-video').srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate && roomChannel) {
            roomChannel.send({ type: 'broadcast', event: 'ice-candidate', payload: { candidate: event.candidate, sender: myAlias } });
          }
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingCallData.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        roomChannel.send({
          type: 'broadcast',
          event: 'call-answer',
          payload: { answer, sender: myAlias }
        });

      } catch (err) {
        alert("Failed to connect call!");
        endCall();
      }
    }

    function rejectCall() {
      stopRingtoneSound();
      document.getElementById('incoming-call-modal').classList.add('hidden');
      if (roomChannel) {
        roomChannel.send({ type: 'broadcast', event: 'call-rejected', payload: { sender: myAlias } });
      }
    }

    function endCall() {
      stopRingtoneSound();
      if (peerConnection) peerConnection.close();
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      
      peerConnection = null;
      localStream = null;

      document.getElementById('call-screen').classList.add('hidden');
      document.getElementById('incoming-call-modal').classList.add('hidden');

      if (roomChannel) {
        roomChannel.send({ type: 'broadcast', event: 'call-ended', payload: { sender: myAlias } });
      }
    }

    function toggleMute() {
      if (localStream && localStream.getAudioTracks().length > 0) {
        isMuted = !isMuted;
        localStream.getAudioTracks()[0].enabled = !isMuted;
        document.getElementById('mute-icon').className = isMuted ? "fa-solid fa-microphone-slash" : "fa-solid fa-microphone";
      }
    }

    messageInput.addEventListener('input', () => {
      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'typing',
          payload: { user: myAlias }
        });
      }
    });

    function handleSendForm(e) {
      e.preventDefault();
      sendMessage();
      messageInput.focus();
    }

    async function sendMessage(textPayload = null) {
      const text = textPayload || messageInput.value.trim();
      if (!text || !supabaseClient) return;

      let finalPayload = text;
      if (activeReplyMsg) {
        finalPayload = `[REPLY user="${activeReplyMsg.user}"]${activeReplyMsg.text}[/REPLY]${text}`;
        cancelReply();
      }

      if (!textPayload) messageInput.value = '';

      await supabaseClient.from('room_messages').insert([
        { room_id: currentRoom, sender_alias: myAlias, message_text: finalPayload }
      ]);
    }

    function setupDoubleTapReply(element, sender, text) {
      let lastTap = 0;
      element.addEventListener('touchend', function (e) {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
          setReplyTarget(sender, text);
          e.preventDefault();
        }
        lastTap = currentTime;
      });

      element.addEventListener('dblclick', function () {
        setReplyTarget(sender, text);
      });
    }

    function setReplyTarget(sender, text) {
      let cleanText = text;
      if (text.includes('[/REPLY]')) {
        cleanText = text.split('[/REPLY]')[1];
      }
      if (cleanText.startsWith('[IMG]')) cleanText = '📷 Photo';
      if (cleanText.startsWith('[AUDIO]')) cleanText = '🎙️ Voice Message';

      activeReplyMsg = { user: sender, text: cleanText };
      document.getElementById('reply-user').innerText = sender;
      document.getElementById('reply-text').innerText = cleanText;
      document.getElementById('reply-preview').classList.remove('hidden');
      messageInput.focus();
    }

    function cancelReply() {
      activeReplyMsg = null;
      document.getElementById('reply-preview').classList.add('hidden');
    }

    function triggerImageUpload() {
      document.getElementById('image-upload-input').click();
    }

    async function handleImageSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        return alert("ছবি বা ফাইলের সাইজ ১০ মেগাবাইটের বেশি হওয়া যাবে না!");
      }

      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (data.secure_url) {
          sendMessage(`[IMG]${data.secure_url}[/IMG]`);
        } else {
          alert("ছবি আপলোড হতে সমস্যা হয়েছে!");
        }
      } catch (err) {
        alert("সার্ভারে ছবি আপলোড করা যায়নি!");
      }

      event.target.value = '';
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
        };

        mediaRecorder.start();

        recordingPopup.classList.remove('hidden');
        secondsRecorded = 0;
        recTimer.innerText = "00:00";

        recTimerInterval = setInterval(() => {
          secondsRecorded++;
          const mins = String(Math.floor(secondsRecorded / 60)).padStart(2, '0');
          const secs = String(secondsRecorded % 60).padStart(2, '0');
          recTimer.innerText = `${mins}:${secs}`;
        }, 1000);

      } catch (err) {
        alert("Microphone access denied!");
      }
    }

    function cancelRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      clearInterval(recTimerInterval);
      recordingPopup.classList.add('hidden');
    }

    function stopAndSendRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

      mediaRecorder.onstop = () => {
        clearInterval(recTimerInterval);
        recordingPopup.classList.add('hidden');

        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Audio = e.target.result;
          sendMessage(`[AUDIO]${base64Audio}[/AUDIO]`);
        };
        reader.readAsDataURL(audioBlob);
      };

      mediaRecorder.stop();
    }

    async function unsendMessage(msgId) {
      if (!confirm("Unsend this message?")) return;
      
      const { error } = await supabaseClient.from('room_messages').delete().eq('id', msgId);
      if (!error) {
        const el = document.getElementById(`msg-${msgId}`);
        if (el) el.remove();
      }
    }

    async function sendReaction(msgId, emoji) {
      if (roomChannel) {
        roomChannel.send({
          type: 'broadcast',
          event: 'reaction',
          payload: { msgId, emoji, user: myAlias }
        });
      }
      applyReaction(msgId, emoji, myAlias);
      closeAllPopups();
    }

    function applyReaction(msgId, emoji, user) {
      const container = document.getElementById(`reactions-${msgId}`);
      if (!container) return;
      
      let badge = container.querySelector(`[data-emoji="${emoji}"]`);
      if (badge) {
        let count = parseInt(badge.getAttribute('data-count')) + 1;
        badge.setAttribute('data-count', count);
        badge.innerText = `${emoji} ${count}`;
      } else {
        badge = document.createElement('span');
        badge.setAttribute('data-emoji', emoji);
        badge.setAttribute('data-count', '1');
        badge.innerText = `${emoji} 1`;
        container.appendChild(badge);
      }
    }

    function closeAllPopups() {
      if (popupTimer) clearTimeout(popupTimer);
      document.querySelectorAll('.reaction-popup').forEach(el => el.remove());
    }

    async function promptClearChat() {
      const pwd = prompt("Enter Master Password to delete all messages in this room:");
      if (pwd === "ss43") {
        await supabaseClient.from('room_messages').delete().eq('room_id', currentRoom);
        loadMessages(true);
      } else if (pwd !== null) {
        alert("Incorrect Password!");
      }
    }

    async function loadMessages(autoScroll = false) {
      const SeventyTwoHoursAgo = new Date(Date.now() - (72 * 60 * 60 * 1000)).toISOString();

      const { data, error } = await supabaseClient
        .from('room_messages')
        .select('*')
        .eq('room_id', currentRoom)
        .gte('created_at', SeventyTwoHoursAgo)
        .order('created_at', { ascending: true });

      if (error) return;

      messagesContainer.innerHTML = `
        <div class="system-welcome-card">
          <div class="welcome-title"><i class="fa-solid fa-shield-halved"></i> KNChat Encrypted Vault</div>
          <div class="welcome-text">Created by <b>Kazim Nahian</b>. Private & Anonymous end-to-end environment.</div>
        </div>
      `;

      data.forEach(msg => appendMessage(msg, false));
      if (autoScroll) scrollToBottom();
      updateReadReceipts();
    }

    function updateReadReceipts() {
      const state = roomChannel ? roomChannel.presenceState() : {};
      const onlineUsers = Object.keys(state).length;

      document.querySelectorAll('.read-receipt').forEach(el => {
        if (onlineUsers > 1) {
          el.innerHTML = '<i class="fa-solid fa-check-double"></i>';
          el.classList.add('seen');
        } else {
          el.innerHTML = '<i class="fa-solid fa-check"></i>';
          el.classList.remove('seen');
        }
      });
    }

    function subscribeToRoom() {
      if (roomChannel && supabaseClient) supabaseClient.removeChannel(roomChannel);

      roomChannel = supabaseClient.channel(`room_${currentRoom}`, {
        config: { presence: { key: myAlias } }
      });

      roomChannel
        .on('postgres_changes', {
          event: '*', schema: 'public', table: 'room_messages', filter: `room_id=eq.${currentRoom}`
        }, payload => {
          if (payload.eventType === 'INSERT') {
            appendMessage(payload.new, true);
            if (isRoomLockedForAlert && payload.new.sender_alias !== myAlias) {
              playRingtoneSound();
              setTimeout(stopRingtoneSound, 2000);
            }
          } else if (payload.eventType === 'DELETE') {
            const el = document.getElementById(`msg-${payload.old.id}`);
            if (el) el.remove();
          }
        })
        .on('broadcast', { event: 'typing' }, payload => {
          if (payload.payload.user !== myAlias) {
            typingUser.innerText = payload.payload.user;
            typingIndicator.classList.remove('hidden');
            scrollToBottom();
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
              typingIndicator.classList.add('hidden');
            }, 2500);
          }
        })
        .on('broadcast', { event: 'reaction' }, payload => {
          if (payload.payload.user !== myAlias) {
            applyReaction(payload.payload.msgId, payload.payload.emoji, payload.payload.user);
          }
        })
        .on('broadcast', { event: 'call-offer' }, payload => {
          if (payload.payload.caller !== myAlias) {
            incomingCallData = payload.payload;
            document.getElementById('caller-name').innerText = `${payload.payload.caller} is calling...`;
            document.getElementById('call-type-text').innerText = payload.payload.isVideo ? "Incoming Video Call" : "Incoming Audio Call";
            document.getElementById('incoming-call-modal').classList.remove('hidden');
            playRingtoneSound();
          }
        })
        .on('broadcast', { event: 'call-answer' }, async payload => {
          if (payload.payload.sender !== myAlias && peerConnection) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.payload.answer));
            document.getElementById('call-status').innerText = "Connected";
          }
        })
        .on('broadcast', { event: 'ice-candidate' }, async payload => {
          if (payload.payload.sender !== myAlias && peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(payload.payload.candidate));
          }
        })
        .on('broadcast', { event: 'call-ended' }, () => { endCall(); })
        .on('broadcast', { event: 'call-rejected' }, () => {
          alert("Call Rejected");
          endCall();
        })
        .on('presence', { sync: () => {
          const state = roomChannel.presenceState();
          const count = Object.keys(state).length;
          onlineCountSpan.innerText = `${count} Online`;
          updateReadReceipts();
        }})
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await roomChannel.track({ online_at: new Date().toISOString() });
          }
        });
    }

    function toggleAudioPlay(btn, audioSrc) {
      let audio = btn._audioInstance;
      if (!audio) {
        audio = new Audio(audioSrc);
        btn._audioInstance = audio;

        audio.onended = () => {
          btn.innerHTML = '<i class="fa-solid fa-play"></i>';
        };
      }

      if (audio.paused) {
        audio.play();
        btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
      } else {
        audio.pause();
        btn.innerHTML = '<i class="fa-solid fa-play"></i>';
      }
    }

    function appendMessage(msg, isLiveNew = false) {
      if (document.getElementById(`msg-${msg.id}`)) return;

      const div = document.createElement('div');
      const isMyMessage = msg.sender_alias === myAlias;

      div.id = `msg-${msg.id}`;
      div.classList.add('message', isMyMessage ? 'outgoing' : 'incoming');

      const isAdminTag = msg.sender_alias.includes('Kazim Nahian');
      const state = roomChannel ? roomChannel.presenceState() : {};
      const isMultipleOnline = Object.keys(state).length > 1;

      let rawText = msg.message_text;
      let replyHTML = '';

      if (rawText.startsWith('[REPLY') && rawText.includes('[/REPLY]')) {
        const replyPart = rawText.substring(0, rawText.indexOf('[/REPLY]') + 8);
        rawText = rawText.replace(replyPart, '');

        const userMatch = replyPart.match(/user="([^"]+)"/);
        const repUser = userMatch ? userMatch[1] : 'User';
        const repText = replyPart.replace(/\[REPLY[^\]]*\]/, '').replace('[/REPLY]', '');

        replyHTML = `
          <div class="replied-context">
            <div class="replied-context-user">${escapeHTML(repUser)}</div>
            <div>${escapeHTML(repText)}</div>
          </div>
        `;
      }

      let contentHTML = '';

      if (rawText.startsWith('[IMG]') && rawText.endsWith('[/IMG]')) {
        const imgSrc = rawText.replace('[IMG]', '').replace('[/IMG]', '');
        contentHTML = `<img src="${imgSrc}" class="chat-img-msg" onclick="window.open('${imgSrc}')" />`;
      } else if (rawText.startsWith('[AUDIO]') && rawText.endsWith('[/AUDIO]')) {
        const audioSrc = rawText.replace('[AUDIO]', '').replace('[/AUDIO]', '');
        contentHTML = `
          <div class="audio-player-box">
            <button class="audio-play-btn" onclick="toggleAudioPlay(this, '${audioSrc}')">
              <i class="fa-solid fa-play"></i>
            </button>
            <div class="audio-wave-visual">
              <div class="audio-wave-bar" style="height:12px;"></div>
              <div class="audio-wave-bar" style="height:18px;"></div>
              <div class="audio-wave-bar" style="height:8px;"></div>
              <div class="audio-wave-bar" style="height:15px;"></div>
              <div class="audio-wave-bar" style="height:10px;"></div>
            </div>
            <span style="font-size:11px; opacity:0.8;"><i class="fa-solid fa-microphone"></i> Voice</span>
          </div>
        `;
      } else {
        contentHTML = `<div>${escapeHTML(rawText)}</div>`;
      }

      div.innerHTML = `
        <span class="sender-tag" style="${isAdminTag ? 'color:#c084fc;' : ''}">
          ${isAdminTag ? '<i class="fa-solid fa-crown"></i> Kazim Nahian (Admin)' : (isMyMessage ? 'You' : msg.sender_alias)}
        </span>
        ${replyHTML}
        ${contentHTML}

        <div id="reactions-${msg.id}" class="reactions-display"></div>

        <div class="msg-meta">
          <span>${new Date(msg.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          ${isMyMessage ? `<span class="read-receipt ${isMultipleOnline ? 'seen' : ''}">${isMultipleOnline ? '<i class="fa-solid fa-check-double"></i>' : '<i class="fa-solid fa-check"></i>'}</span>` : ''}
        </div>
      `;

      let pressTimer;

      const startPress = (e) => {
        pressTimer = setTimeout(() => {
          openReactionPopup(div, msg.id, isMyMessage);
        }, 350);
      };

      const cancelPress = () => clearTimeout(pressTimer);

      div.addEventListener('touchstart', startPress);
      div.addEventListener('touchend', cancelPress);
      div.addEventListener('touchmove', cancelPress);
      div.addEventListener('mousedown', startPress);
      div.addEventListener('mouseup', cancelPress);
      div.addEventListener('mouseleave', cancelPress);

      setupDoubleTapReply(div, isMyMessage ? 'You' : msg.sender_alias, msg.message_text);

      messagesContainer.appendChild(div);

      if (isLiveNew && (!isUserScrolledUp || isMyMessage)) {
        scrollToBottom();
      }
    }

    function openReactionPopup(msgElement, msgId, isMyMessage) {
      closeAllPopups();

      const popup = document.createElement('div');
      popup.className = 'reaction-popup';
      popup.onclick = (e) => e.stopPropagation();

      const emojis = ['👍', '❤️', '😂', '🔥', '😮'];
      emojis.forEach(emoji => {
        const span = document.createElement('span');
        span.className = 'react-emoji';
        span.innerText = emoji;
        span.onclick = () => sendReaction(msgId, emoji);
        popup.appendChild(span);
      });

      if (isMyMessage || isAdminUser) {
        const delBtn = document.createElement('span');
        delBtn.style.cssText = 'font-size:12px; color:#ff7b72; cursor:pointer; margin-left:4px; display:flex; align-items:center;';
        delBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
        delBtn.onclick = () => { unsendMessage(msgId); closeAllPopups(); };
        popup.appendChild(delBtn);
      }

      msgElement.appendChild(popup);

      popupTimer = setTimeout(() => {
        popup.remove();
      }, 5000);
    }

    function scrollToBottom() { 
      messagesContainer.scrollTop = messagesContainer.scrollHeight; 
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
